[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "htvl-mcp"
version = "1.0.0"
description = "MCP server that lets coding agents compile and repair HTVL with structured, line-local diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nicholas Rotich" }, { name = "HTVL contributors" }]
keywords = ["mcp", "htvl", "html", "ai-agents", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]
dependencies = [
    # Pinned to the v1 line: mcp 2.x renamed FastMCP to MCPServer (D15).
    "mcp>=1.2,<2",
    "imprimatur",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/moinonin/htvl"
Repository = "https://github.com/moinonin/htvl"
"Bug Tracker" = "https://github.com/moinonin/htvl/issues"

[project.scripts]
htvl-mcp = "htvl_mcp.server:main"

[tool.setuptools]
packages = ["htvl_mcp"]

# Resolve the oracle from this repository's uv workspace.
[tool.uv.sources]
imprimatur = { workspace = true }
