[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "htvl-lang"
version = "0.2.0"
description = "HTVL - a tiny HTML transpiler: write .htvl files, get HTML."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Nicholas Rotich" }, { name = "HTVL contributors" }]
keywords = ["html", "transpiler", "static-site", "compiler", "dsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pygments>=2.10"]

[project.urls]
Homepage = "https://github.com/moinonin/htvl"
Repository = "https://github.com/moinonin/htvl"

[project.scripts]
htvl = "htvl.cli:main"

[tool.setuptools]
packages = ["htvl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
