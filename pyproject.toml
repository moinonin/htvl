[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "htvl-lang"
version = "0.2.0"
description = "HTVL - a tiny HTML transpiler: write .htvl files, get HTML."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nicholas Rotich" }, { name = "HTVL contributors" }]
keywords = ["html", "transpiler", "static-site", "compiler", "dsl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pygments>=2.10",
    # htvl-mcp's only dependency; needed for tests/test_mcp.py.
    "mcp>=1.2,<2",
]

[project.urls]
Homepage = "https://github.com/moinonin/htvl"
Repository = "https://github.com/moinonin/htvl"
"Bug Tracker" = "https://github.com/moinonin/htvl/issues"
Changelog = "https://github.com/moinonin/htvl/releases"

[project.scripts]
htvl = "htvl.cli:main"

[tool.setuptools]
packages = ["htvl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

# Imprimatur, htvl-mcp and imprimatur-eval are sibling packages in this
# repository; the workspace lets uv resolve them by name without PyPI.
[tool.uv.workspace]
members = ["imprimatur", "htvl-mcp"]
