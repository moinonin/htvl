[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imprimatur-eval"
version = "1.0.0"
description = "Dataset builder, repair-trace recorder and A/B harness for oracle-assisted HTVL generation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nicholas Rotich" }, { name = "HTVL contributors" }]
keywords = ["htvl", "evaluation", "repair", "benchmark", "sft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Compilers",
]
dependencies = ["imprimatur"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/moinonin/htvl"
Repository = "https://github.com/moinonin/htvl"
"Bug Tracker" = "https://github.com/moinonin/htvl/issues"

[project.scripts]
imprimatur-eval = "imprimatur_eval.cli:main"

[tool.setuptools]
packages = ["imprimatur_eval"]

# Resolve the oracle from this repository's uv workspace.
[tool.uv.sources]
imprimatur = { workspace = true }
